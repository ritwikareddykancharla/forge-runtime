[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-runtime"
version = "0.1.0"
description = "Context slicer, SQL column guard, and warm sandbox runner for coding and analytics agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ritwika Kancharla" }
]
keywords = [
    "ai-agents",
    "ast-repo-graph",
    "multi-model-routing",
    "cedar-policy",
    "aws-sts-obo",
    "sandbox-runtime",
    "mcp",
    "iceberg-governance",
    "aws-bedrock"
]
dependencies = []

[project.optional-dependencies]
aws = [
    "boto3>=1.35.0",
    "strands-agents>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
forge-runtime = "forge_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_runtime*"]
