<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, system-ui, sans-serif">
  <defs>
    <pattern id="bp-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#c3cfe2"/>
    </pattern>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0e1a2b"/>
    </marker>
    <marker id="ah-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6433"/>
    </marker>
  </defs>

  <rect width="1120" height="480" fill="#f2f5fa"/>
  <rect width="1120" height="480" fill="url(#bp-dots)"/>
  <rect x="12" y="12" width="1096" height="456" fill="none" stroke="#0e1a2b" stroke-width="1.5"/>

  <text x="34" y="46" font-size="18" font-weight="800" fill="#0e1a2b" letter-spacing="-0.4">ForgeRuntime — CloudFront + 2-Hop AST Slicer + Warm Sandbox + Governed Iceberg Proxy</text>
  <text x="34" y="66" font-family="'Martian Mono', ui-monospace, monospace" font-size="10.5" fill="#6b7a92">AWS TRANSFORM &amp; VELOCITY LABS ARCHITECTURE · -83.2% TOKENS (5.97x) · 0.63MS WARM SANDBOX (10/10 ESCAPE BLOCK) · C-AUTHORIZER PII GATE</text>

  <!-- Node 1: 3-Pane Modernization IDE -->
  <g>
    <rect x="34" y="136" width="176" height="220" fill="#0e1a2b" stroke="#0e1a2b" stroke-width="1.5"/>
    <text x="50" y="162" font-family="'Martian Mono', monospace" font-size="9.5" fill="#cbd5e1" letter-spacing="1">01 · CLIENT IDE</text>
    <text x="50" y="186" font-size="16" font-weight="700" fill="#ffffff">3-Pane Studio</text>
    <text x="50" y="212" font-family="'Martian Mono', monospace" font-size="10.5" fill="#d6e0f5">· Repo Symbol Tree</text>
    <text x="50" y="232" font-family="'Martian Mono', monospace" font-size="10.5" fill="#d6e0f5">· 2-Hop AST Diff</text>
    <text x="50" y="252" font-family="'Martian Mono', monospace" font-size="10.5" fill="#d6e0f5">· Sandbox Runner</text>
    <text x="50" y="272" font-family="'Martian Mono', monospace" font-size="10.5" fill="#d6e0f5">· Iceberg SQL Editor</text>
    <rect x="50" y="294" width="144" height="44" fill="#35527e"/>
    <text x="122" y="314" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="9.5" fill="#ffffff">HTTPS SINGLE ORIGIN</text>
    <text x="122" y="329" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="9" fill="#d6e0f5">URL Hash · Zero CORS</text>
  </g>

  <!-- Node 2: CloudFront Edge -->
  <g>
    <rect x="252" y="114" width="210" height="264" fill="#ffffff" stroke="#35527e" stroke-width="2"/>
    <text x="268" y="140" font-family="'Martian Mono', monospace" font-size="9.5" fill="#35527e" letter-spacing="1">02 · EDGE CDN</text>
    <text x="268" y="163" font-size="16" font-weight="800" fill="#0e1a2b">Amazon CloudFront</text>
    <text x="268" y="181" font-family="'Martian Mono', monospace" font-size="10" fill="#6b7a92">HTTP/2 + HTTP/3 · TLS 1.3</text>

    <rect x="268" y="200" width="178" height="72" fill="#f2f5fa" stroke="#0e1a2b" stroke-width="1.2"/>
    <text x="280" y="221" font-size="12.5" font-weight="700" fill="#0e1a2b">Default Behavior (*)</text>
    <text x="280" y="239" font-family="'Martian Mono', monospace" font-size="10" fill="#33425a">Blueprint 3-Pane IDE</text>
    <text x="280" y="256" font-family="'Martian Mono', monospace" font-size="9.5" fill="#0c8a4d">SigV4 OAC -&gt; Private S3</text>

    <rect x="268" y="286" width="178" height="74" fill="#f2f5fa" stroke="#0e1a2b" stroke-width="1.2"/>
    <text x="280" y="307" font-size="12.5" font-weight="700" fill="#0e1a2b">API Behavior (/api/*)</text>
    <text x="280" y="325" font-family="'Martian Mono', monospace" font-size="10" fill="#33425a">AST + Sandbox + SQL</text>
    <text x="280" y="342" font-family="'Martian Mono', monospace" font-size="9.5" fill="#ff6433">CachingDisabled · Live</text>
  </g>

  <!-- Node 3A: Private S3 -->
  <g>
    <rect x="514" y="96" width="276" height="96" fill="#ffffff" stroke="#0e1a2b" stroke-width="1.5"/>
    <text x="530" y="120" font-family="'Martian Mono', monospace" font-size="9.5" fill="#0c8a4d" letter-spacing="1">03A · PRIVATE STATIC ORIGIN</text>
    <text x="530" y="142" font-size="15" font-weight="800" fill="#0e1a2b">Amazon S3 (BlockPublicAccess)</text>
    <text x="530" y="161" font-family="'Martian Mono', monospace" font-size="10" fill="#33425a">forgeruntime-web-796330847946-us-west-2</text>
    <text x="530" y="178" font-family="'Martian Mono', monospace" font-size="9.5" fill="#6b7a92">CloudFront Service Principal Read-Only</text>
  </g>

  <!-- Node 3B: Lambda Core Runtime -->
  <g>
    <rect x="514" y="210" width="276" height="232" fill="#ffffff" stroke="#35527e" stroke-width="2"/>
    <text x="530" y="234" font-family="'Martian Mono', monospace" font-size="9.5" fill="#35527e" letter-spacing="1">03B · PYTHON 3.12 API ORIGIN</text>
    <text x="530" y="256" font-size="15.5" font-weight="800" fill="#0e1a2b">forgeruntime-api-origin</text>

    <rect x="530" y="272" width="244" height="48" fill="#35527e"/>
    <text x="542" y="292" font-size="12" font-weight="700" fill="#ffffff">1. ASTRepoGraph Context Slicer</text>
    <text x="542" y="309" font-family="'Martian Mono', monospace" font-size="9.5" fill="#d6e0f5">-83.2% Tokens (5.97x) · 100% Recall</text>

    <rect x="530" y="328" width="244" height="48" fill="#f2f5fa" stroke="#0e1a2b" stroke-width="1.2"/>
    <text x="542" y="348" font-size="12" font-weight="700" fill="#0e1a2b">2. WarmSandboxPool (`python3 -I`)</text>
    <text x="542" y="365" font-family="'Martian Mono', monospace" font-size="9.5" fill="#0c8a4d">0.63ms Warm vs 38.7ms Cold · 10/10</text>

    <rect x="530" y="384" width="244" height="46" fill="#f2f5fa" stroke="#0e1a2b" stroke-width="1.2"/>
    <text x="542" y="403" font-size="12" font-weight="700" fill="#0e1a2b">3. Cedar &amp; Iceberg SQL Proxy</text>
    <text x="542" y="419" font-family="'Martian Mono', monospace" font-size="9.5" fill="#d4301a">SQLite set_authorizer (`email`/`ssn`)</text>
  </g>

  <!-- Node 4A: MultiModelRouter + Bedrock -->
  <g>
    <rect x="842" y="136" width="244" height="142" fill="#0e1a2b" stroke="#0e1a2b" stroke-width="1.5"/>
    <text x="858" y="160" font-family="'Martian Mono', monospace" font-size="9.5" fill="#ff6433" letter-spacing="1">04 · ROUTER + BEDROCK</text>
    <text x="858" y="183" font-size="15.5" font-weight="800" fill="#ffffff">MultiModelRouter</text>
    <text x="858" y="203" font-family="'Martian Mono', monospace" font-size="10.5" fill="#8fb0e6">us.amazon.nova-lite-v1:0</text>
    <text x="858" y="226" font-family="'Martian Mono', monospace" font-size="10" fill="#d6e0f5">· Code Modernization</text>
    <text x="858" y="245" font-family="'Martian Mono', monospace" font-size="10" fill="#d6e0f5">· Governed NL-to-SQL</text>
    <text x="858" y="264" font-family="'Martian Mono', monospace" font-size="10" fill="#4fd19a">-59.7% Latency · -35.9% Cost</text>
  </g>

  <!-- Node 4B: Iceberg Catalog -->
  <g>
    <rect x="842" y="300" width="244" height="142" fill="#ffffff" stroke="#0e1a2b" stroke-width="1.5"/>
    <text x="858" y="324" font-family="'Martian Mono', monospace" font-size="9.5" fill="#35527e" letter-spacing="1">05 · GOVERNED LAKE</text>
    <text x="858" y="347" font-size="15" font-weight="800" fill="#0e1a2b">Apache Iceberg Catalog</text>
    <text x="858" y="369" font-family="'Martian Mono', monospace" font-size="10" fill="#33425a">· `customer_ads` (email, ssn)</text>
    <text x="858" y="388" font-family="'Martian Mono', monospace" font-size="10" fill="#33425a">· `ads_campaigns` (ROAS)</text>
    <text x="858" y="407" font-family="'Martian Mono', monospace" font-size="10" fill="#33425a">· `customer_billing` (PCI)</text>
    <text x="858" y="426" font-family="'Martian Mono', monospace" font-size="10" fill="#0c8a4d">· Sovereign Region RLS CTE</text>
  </g>

  <!-- Connectors -->
  <path d="M210 246 L248 246" fill="none" stroke="#0e1a2b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
  <path d="M462 232 L510 146" fill="none" stroke="#0e1a2b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
  <path d="M462 322 L510 322" fill="none" stroke="#ff6433" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-sig)"/>
  <path d="M790 296 L838 214" fill="none" stroke="#ff6433" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-sig)"/>
  <path d="M790 372 L838 372" fill="none" stroke="#0e1a2b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
</svg>
